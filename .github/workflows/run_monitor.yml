name: Monitoreo de Vacantes

on:
  schedule:
    # Se ejecuta automáticamente cada 2 horas (puedes ajustarlo)
    - cron: '0 */2 * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente desde la pestaña Actions de GitHub

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Necesario para que el script pueda guardar el archivo JSON en el repo

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar script de monitoreo
        run: python monitor_jobs.py

      - name: Guardar y actualizar vacantes vistas en el repositorio
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.io"
          git add seen_jobs.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Actualizar registro de vacantes vistas [skip ci]" && git push)
